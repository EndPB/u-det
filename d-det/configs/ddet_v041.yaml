# d-det v0.4.1（去冗余对照臂）= v0.4.0 + EMA 协方差非对角惩罚（Barlow/VICReg-lite）
#   回答"把信息集中到一个维度、显式压制其它维度"是否必要：文献偏否定（Elazar&Goldberg 2018
#   对抗式移除不可靠），此臂做低成本正对照（去冗余 ≠ 信息压制）。
#   基座同 v0.4.0：--resume runs/v0.3.0_fullft/last.pt --epochs 2
data:
  processed_dir: data/processed
  m4_file: m4.parquet
  hybrid_file: hybrid.parquet
  pair_file: pairs.parquet
  pairxf_files: [pairs.parquet, pairs_qwen15.parquet]

encoder:
  name: codet5blk
  path: checkpoints/codet5-base
  dtype: float32
  layer: -1
  block: 512
  block_batch: 8
  r: 16
  alpha: 32
  dropout: 0.0
  targets: [v, o, wi, wo]
  full_ft: true
  static: false
  ckpt: true
  compile: false
  freeze: false

model:
  name: dual
  pool: mean
  attn_dim: 128
  dropout: 0.0
  mlp_layers: 0
  s2_rank: 1

loss:
  s1: 1.0
  s2: 1.0
  margin: 1.0
  orth: 0.05
  mlm: 0.2
  mlm_prob: 0.15
  token: 1.0
  anchor: 0.0
  rep: 1.0
  rep_margin: 1.5
  fisher: 1.0
  fisher_momentum: 0.95
  fisher_target: 1.386
  fisher_warmup: 24
  fisher_min_gap: 0.05
  xfam: 0.5
  cov: 10.0                # ★ 对照臂：去冗余（依据冒烟时 loss_cov 量级再微调）

train:
  streams: [m4, hybrid, pair, pairxf]
  epochs: 2
  grad_accum: 8
  lr: 0.0003
  lr_encoder: 2.0e-05
  weight_decay: 0.01
  warmup: 0.05
  grad_clip: 1.0
  amp: true
  num_workers: 2
  num_workers_pairxf: 1
  log_every: 200
  monitor: mean
  seed: 0
  out_dir: runs
