# d-det × Qwen2.5-Coder-1.5B（decoder-only「编码器式」骨干；LoRA）
#   用法：python scripts/semeval_finetune.py --task b --config configs/ddet_qwen.yaml \
#            --data-dir data/processed/semeval_qwen --init none --lr-encoder 2e-4
#   数据：data/processed/semeval_qwen/（Qwen 重分词，行与 CodeT5 版严格对齐）
encoder:
  name: qwen
  path: checkpoints/qwen2.5-coder-1.5b-instruct
  dtype: bfloat16
  layer: -1
  r: 32
  alpha: 64
  dropout: 0.0
  targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  full_ft: false
  ckpt: true
  compile: false

model:
  name: dual
  pool: mean
  attn_dim: 128
  dropout: 0.0
  mlp_layers: 0
  s2_rank: 1

train:
  epochs: 2
