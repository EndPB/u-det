# U-Det 配置（数据 / 编码器 / 网络 / 报告 / 损失 / 训练），路径相对于项目根目录。
# 消融开关：encoder.name（codet5tok/codet5）、model.mid.name（transformer/none）、
#           report.name（handcrafted/none）、loss.token（0 则退化为纯样本级）、train.streams。

data:
  processed_dir: data/processed                 # scripts/build_subset.py 产出
  m4_file: m4.parquet                           # 样本级：human/AI 各 1w，长度×语言均衡
  hybrid_file: hybrid.parquet                   # token 级：行级标注（全量）

encoder:
  name: codet5tok                               # 逐 token 独立编码（长度=1，可查表）
  path: checkpoints/codet5-base                 # 权重目录（scripts/prepare.py encoder 下载）
  dtype: float32                                # 构建 LUT 时的加载精度
  lut: data/processed/codet5_lut.pt             # LUT 缓存（首次自动构建）
  layer: -1                                     # 取第几层隐状态（-1 最后一层，0 词嵌入）
  freeze: false                                 # false = LUT 作为可训练嵌入表（微调编码器）；true = 固定 LUT
  max_length: 512                               # 仅 encoder.name=codet5（整段上下文）时生效

model:
  name: unet1d                                  # unet1d（序列）/ unet2d（图像），见 models/unet.py
  features: [64, 128, 256, 512]                 # 各层通道数（len-1 = 下采样次数 = 3）
  kernel_size: 3
  use_batchnorm: true
  dropout: 0.0
  mid:                                          # U-Net 瓶颈模块（双向语义交互）
    name: transformer                           # transformer / none（消融）
    layers: 2
    heads: 8
    dropout: 0.0
    mlp_ratio: 4

heads:
  sample_hidden: 256                            # 样本级头 MLP 隐层
  sample_dropout: 0.0

report:
  name: handcrafted                             # handcrafted / none（消融）
  max_tokens: 64                                # 报告 token 上限（超长截断）

loss:
  sample: 1.0                                   # 样本级 CE 权重
  token: 1.0                                    # token 级 BCE 总权重（0 = 只用样本级）
  scale_weights: [0.25, 0.5, 0.75, 1.0]         # 各上采样尺度权重，由粗到细（L/8, L/4, L/2, L）
  class_weights: null                           # 样本级类别权重，如 [1.0, 1.0]

train:
  streams: [m4, hybrid]                         # 双流并行：每 step 两流各取一个 batch、同时参与（只留一个即单任务）
  epochs: 3
  batch_size: {m4: 16, hybrid: 4}               # hybrid 序列长，批小
  max_length: {m4: 512, hybrid: 2048}           # 训练窗口（超长样本随机截取）
  eval_max_length: 2048                         # 评测窗口（超长样本滑窗合并）
  eval_batch_size: 16
  lr: 0.001
  lr_encoder: 0.0001                            # 编码器（可训练 LUT）单独学习率（encoder.freeze=true 时无此项）
  weight_decay: 0.01
  warmup: 0.05
  grad_clip: 1.0
  amp: true                                     # bf16 自动混合精度
  num_workers: 4
  log_every: 20
  monitor: mean                                 # mean / m4_f1 / line_f1（选 best.pt 用）
  seed: 0
  out_dir: runs
