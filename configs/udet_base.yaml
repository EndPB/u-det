# U-Det 配置（数据 / 编码器 / 网络），路径相对于项目根目录。

data:
  raw_dir: data/raw/CoDET-M4                    # 由 scripts/prepare.py data 下载
  file: dataset_without_comments.parquet        # 全量数据（500,552 行）
  text_column: cleaned_code                     # 输入列：cleaned_code（去注释）/ code
  max_length: 512

encoder:
  name: codet5                                  # 对应 encoders/__init__.py 中 ENCODERS 的键
  path: checkpoints/codet5-base                 # 权重目录（scripts/prepare.py encoder 下载）
  dtype: float32                                # float32 / float16 / bfloat16
  freeze: false
  gradient_checkpointing: false

model:
  name: unet1d                                  # unet1d（序列）/ unet2d（图像），见 models/unet.py
  in_channels: 768                              # 与编码器 hidden_size 一致（CodeT5-base = 768）
  out_channels: 2                               # 类别数，按任务调整
  features: [64, 128, 256, 512]                 # 各层通道数
  kernel_size: 3
  use_batchnorm: true
  dropout: 0.0
  bilinear: false                               # 仅 2D：双线性插值上采样 / 转置卷积
